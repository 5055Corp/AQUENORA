# Deploy with: npx wrangler deploy  (from this folder, after `npx wrangler login`)
name = "aquenora-stores"
main = "store-worker.js"
compatibility_date = "2026-10-01"

# Runs for sellers' own domains (custom hostnames) that reach the aquenora.com zone.
routes = [{ pattern = "*/*", zone_name = "aquenora.com" }]

[vars]
BACKEND_ORIGIN = "https://api.aquenora.com"
# The seller app's address (grey-cloud DNS, so it goes straight to Railway's web service).
WEB_ORIGIN = "https://app.aquenora.com"
