name: Photo picks (one-off)
on:
  push:
    branches: [photo-picks]
    paths: [".github/photo-queries.txt"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download CC0 / public-domain photos from Openverse
        run: |
          mkdir -p photos
          python3 - <<'PY'
          import json, urllib.request, urllib.parse
          qs = [q.strip() for q in open(".github/photo-queries.txt") if q.strip()]
          ua = {"User-Agent": "aquenora-photo-picks/1.0"}
          for i, q in enumerate(qs, 1):
              url = "https://api.openverse.org/v1/images/?" + urllib.parse.urlencode({"q": q, "license": "cc0,pdm", "category": "photograph", "page_size": 20, "mature": "false"})
              try:
                  d = json.load(urllib.request.urlopen(urllib.request.Request(url, headers=ua), timeout=30))
              except Exception as e:
                  print("search failed", q, e); continue
              keep = []
              for r in d.get("results", []):
                  if (r.get("width") or 0) < 900: continue
                  name = f"photos/{i:02d}-{len(keep):02d}.jpg"
                  try:
                      data = urllib.request.urlopen(urllib.request.Request(r["url"], headers=ua), timeout=30).read()
                      if len(data) < 20000 or len(data) > 15_000_000: continue
                      open(name, "wb").write(data)
                  except Exception:
                      continue
                  keep.append({"file": name, "title": r.get("title"), "license": r.get("license"), "source": r.get("source"), "page": r.get("foreign_landing_url"), "by": r.get("creator")})
                  if len(keep) == 10: break
              print(q, len(d.get("results", [])), "->", len(keep))
              json.dump(keep, open(f"photos/{i:02d}.json", "w"), indent=1)
          PY
      - name: Shrink
        run: |
          sudo apt-get -qq install -y imagemagick >/dev/null || true
          for f in photos/*.jpg; do mogrify -resize '1400x1400>' -quality 82 "$f" || true; done
      - name: Save
        run: |
          git config user.name "photo-picks"
          git config user.email "photo-picks@users.noreply.github.com"
          git add photos && git commit -qm "Candidate photos" && git push
